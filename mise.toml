# Developer commands live here; build behavior lives in build.gradle.kts.
# The Gradle wrapper pins Gradle; mise provisions Java and Zola on all platforms.
[tools]
java = "temurin-21.0.13+9.0.LTS"
zola = "0.23.6"

# Extra arguments to `mise run <task> -- ...` are forwarded to the task's command.
[tasks.default]
description = "List available development commands"
run = "mise tasks ls"

[tasks.build]
description = "Compile, test, and package the library, sources, and Javadoc"
run = "sh ./gradlew build"
run_windows = "cmd /d /c gradlew.bat build"

[tasks.test]
description = "Run unit tests (forward filters with -- --tests ...)"
run = "sh ./gradlew test"
run_windows = "cmd /d /c gradlew.bat test"

[tasks.check]
description = "Run Gradle verification tasks"
run = "sh ./gradlew check"
run_windows = "cmd /d /c gradlew.bat check"

[tasks.clean]
description = "Remove generated build outputs through Gradle"
run = "sh ./gradlew clean"
run_windows = "cmd /d /c gradlew.bat clean"

[tasks.docs]
description = "Generate API documentation in build/docs/javadoc"
run = "sh ./gradlew javadoc"
run_windows = "cmd /d /c gradlew.bat javadoc"

[tasks."publish:local"]
description = "Build, test, and publish the snapshot to local Maven"
run = "sh ./gradlew build publishToMavenLocal"
run_windows = "cmd /d /c gradlew.bat build publishToMavenLocal"

[tasks.ci]
description = "Clean, package the library, and run unit tests (no benchmark tasks)"
# One Gradle invocation keeps clean and build ordered.
run = "sh ./gradlew --no-daemon clean build"
run_windows = "cmd /d /c gradlew.bat --no-daemon clean build"

[tasks."ci:lint"]
description = "Validate GitHub Actions workflows with actionlint (no Docker needed)"
tools = { "aqua:rhysd/actionlint" = "1.7.12" }
# Keep results consistent even when optional shellcheck/pyflakes are on PATH.
run = "actionlint -shellcheck= -pyflakes="

[tasks."ci:local"]
description = "Run the Ubuntu CI job with act (requires Docker running Linux containers)"
depends = ["ci:lint"]
tools = { "aqua:nektos/act" = "0.2.97" }
raw = true
# Restrict execution to the build workflow and one matrix entry; Pages stays on GitHub.
# amd64 matches the hosted Ubuntu job, including on Apple Silicon via emulation.
run = "act push --workflows .github/workflows/ci.yml --job build --matrix os:ubuntu-latest --platform ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-26.04 --container-architecture linux/amd64"

[tasks.gradle]
description = "Run any Gradle command (mise run gradle -- dependencies)"
run = "sh ./gradlew"
run_windows = "cmd /d /c gradlew.bat"

[tasks."benchmark:check"]
description = "Manually compile the benchmark harness and run its fixture tests"
run = "sh ./gradlew benchmarkTest"
run_windows = "cmd /d /c gradlew.bat benchmarkTest"

[tasks.benchmark]
description = "Run JMH comparisons and print the browser report URL"
run = "sh ./gradlew benchmark"
run_windows = "cmd /d /c gradlew.bat benchmark"

[tasks."benchmark:smoke"]
description = "Check benchmark wiring with a short N=1000 run (not performance evidence)"
run = "sh ./gradlew benchmarkSmoke"
run_windows = "cmd /d /c gradlew.bat benchmarkSmoke"

[tasks."benchmark:scalable"]
description = "Compare fixed vs scalable Bloom at N=1000, 10000, 100000 and write a browser report"
run = "sh ./gradlew benchmarkScalable"
run_windows = "cmd /d /c gradlew.bat benchmarkScalable"

[tasks."benchmark:flamegraph"]
description = "Profile with JFR and generate browser-ready HTML flamegraphs"
run = "sh ./gradlew benchmarkFlamegraph"
run_windows = "cmd /d /c gradlew.bat benchmarkFlamegraph"

[tasks."benchmark:allocation"]
description = "Verify lookup allocation for ASCII, Unicode, malformed, and long strings at N=1000"
run = "sh ./gradlew benchmarkAllocation"
run_windows = "cmd /d /c gradlew.bat benchmarkAllocation"

[tasks."benchmark:misses"]
description = "Compare absent rapidhash and JDK lookups across all five sizes with hot and broad query pools"
run = "sh ./gradlew benchmarkMisses"
run_windows = "cmd /d /c gradlew.bat benchmarkMisses"

[tasks."benchmark:prefilter"]
description = "Measure exact downstream work with and without Bloom, including false positives"
run = "sh ./gradlew benchmarkPrefilter"
run_windows = "cmd /d /c gradlew.bat benchmarkPrefilter"

[tasks."benchmark:heap"]
description = "Measure live object graph footprint and print the browser report URL"
run = "sh ./gradlew benchmarkHeap"
run_windows = "cmd /d /c gradlew.bat benchmarkHeap"

[tasks."benchmark:large"]
description = "Compare fresh-input misses for standard/blocked Bloom and JDK collections at N=1000, 10m, and 50m"
run = "sh ./gradlew benchmarkLarge"
run_windows = "cmd /d /c gradlew.bat benchmarkLarge"

[tasks."benchmark:large:smoke"]
description = "Check the large comparison fixture at N=1000 without drawing timing conclusions"
run = "sh ./gradlew benchmarkLargeSmoke"
run_windows = "cmd /d /c gradlew.bat benchmarkLargeSmoke"

[tasks."benchmark:large:accuracy"]
description = "Calibrate blocked sizing or validate independent false-positive rates"
run = "sh ./gradlew benchmarkLargeAccuracy"
run_windows = "cmd /d /c gradlew.bat benchmarkLargeAccuracy"

[tasks."benchmark:large:flamegraph"]
description = "Profile the large comparison and print links to JFR and HTML flamegraphs"
run = "sh ./gradlew benchmarkLargeProfile"
run_windows = "cmd /d /c gradlew.bat benchmarkLargeProfile"

[tasks."benchmark:review"]
description = "Build a combined HTML review from your saved runs without rerunning benchmarks"
run = "sh ./gradlew benchmarkReview"
run_windows = "cmd /d /c gradlew.bat benchmarkReview"

[tasks."benchmark:large:heap"]
description = "Measure retained query-pool memory and print the browser report URL"
run = "sh ./gradlew benchmarkLargeHeap"
run_windows = "cmd /d /c gradlew.bat benchmarkLargeHeap"

[tasks."benchmark:flamegraph:render"]
description = "Rebuild namespace-focused flamegraphs from saved JFR: -- -PprofileRun=path/to/run"
run = "sh ./gradlew benchmarkRenderProfiles"
run_windows = "cmd /d /c gradlew.bat benchmarkRenderProfiles"

[tasks."site:build"]
description = "Build the DevLab website and generated Java API reference in build/site"
run = "sh ./gradlew siteBuild"
run_windows = "cmd /d /c gradlew.bat siteBuild"

[tasks."site:check"]
description = "Build the website and verify local links, anchors, and assets"
run = "sh ./gradlew siteCheck"
run_windows = "cmd /d /c gradlew.bat siteCheck"

[tasks."site:serve"]
description = "Build and preview the full website at http://127.0.0.1:8787"
run = "sh ./gradlew siteServe"
run_windows = "cmd /d /c gradlew.bat siteServe"
